[package]
version = "0.1.0"
name = "sp1-safe-basics"
edition = "2021"

[dependencies]
# ethereum-trie = { git = "https://github.com/polytope-labs/hyperbridge.git", tag= "v0.4.4"}
serde = { version = "1.0.196", features = ["derive"], default-features = false }
